name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Calculate next version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEXT (${{ inputs.bump }})"

      - name: Bump version in files
        run: |
          VERSION=${{ steps.version.outputs.next }}
          # package.json + package-lock.json (npm keeps both in sync)
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # tauri.conf.json
          node -e "
            const conf = require('./src-tauri/tauri.conf.json');
            conf.version = '$VERSION';
            require('fs').writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          # Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # Cargo.lock — refresh the workspace member entry only, leave deps pinned
          cargo update --workspace --manifest-path src-tauri/Cargo.toml

          # Fail early if any target still carries the old version
          git diff --stat
          grep -q "\"version\": \"$VERSION\"" package.json
          grep -q "\"version\": \"$VERSION\"" package-lock.json
          grep -q "\"version\": \"$VERSION\"" src-tauri/tauri.conf.json
          grep -q "^version = \"$VERSION\"" src-tauri/Cargo.toml
          grep -A1 '^name = "qte-time-tracker"' src-tauri/Cargo.lock | grep -q "^version = \"$VERSION\""

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release: v${{ steps.version.outputs.next }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin main --tags

      # App Store Connect API key (.p8) that Tauri uses to notarize the app.
      - name: Write notarization key
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo "$P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Developer ID signing + notarization. Tauri signs with the
          # certificate and notarizes with the API key when these are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          # PostHog project token (public by design) and host, from repo variables.
          # Unset = the app is built with telemetry off.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "QTE Time Tracker ${{ steps.version.outputs.tag }}"
          releaseBody: |
            ## QTE Time Tracker ${{ steps.version.outputs.tag }}

            Download the `.dmg` file below and drag to Applications.

            **Updates:** The app checks for updates automatically.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      # The .dmg tauri-action uploads carries the version in its name, so no
      # URL stays valid across releases. Upload a second copy under a fixed
      # name, so this always downloads the newest build:
      #   https://github.com/qteab/agileday-tracker/releases/latest/download/QTE.Time.Tracker.dmg
      # The HR site's Time Tracker page links to it. The updater is unaffected:
      # latest.json points at the .app.tar.gz, not the .dmg.
      - name: Upload fixed-name .dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          gh release download "$TAG" --pattern '*_aarch64.dmg' --output QTE.Time.Tracker.dmg
          gh release upload "$TAG" QTE.Time.Tracker.dmg --clobber

      # tauri-action signs the updater tarball, uploads it together with its
      # .sig, and generates latest.json itself. Verify that latest.json points
      # at an asset that actually exists on the release, so a broken updater
      # feed fails the workflow instead of 404ing for every user.
      - name: Verify updater feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          gh release download "$TAG" --pattern latest.json --output latest.json
          FEED_URL=$(jq -r '.platforms["darwin-aarch64"].url' latest.json)
          FEED_ASSET=$(basename "$FEED_URL")
          echo "latest.json points at: $FEED_ASSET"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$FEED_ASSET"; then
            echo "latest.json points at an asset that is not on the release:"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
